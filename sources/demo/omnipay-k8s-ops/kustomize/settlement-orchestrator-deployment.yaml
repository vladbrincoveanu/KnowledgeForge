apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement-orchestrator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: settlement-orchestrator
  template:
    metadata:
      labels:
        app: settlement-orchestrator
    spec:
      containers:
        - name: settlement-orchestrator
          image: ghcr.io/knowledgeforge-demos/omnipay-settlement-orchestrator:1.0.0
          env:
            - name: SETTLEMENT_SQLSERVER_CONNECTION
              value: Server=tcp:sqlserver,1433;Initial Catalog=SettlementOps
            - name: RABBITMQ_URL
              value: amqp://rabbitmq:5672
            - name: REDIS_URL
              value: redis://redis:6379/4
          ports:
            - containerPort: 8080
