version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: knowledgeforge-postgres
    environment:
      POSTGRES_DB: knowledgeforge
      POSTGRES_USER: knowledgeforge
      POSTGRES_PASSWORD: knowledgeforge123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledgeforge -d knowledgeforge"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - knowledgeforge-network

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.15-community
    container_name: knowledgeforge-neo4j
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
      - NEO4J_server_memory_pagecache_size=512m
      - NEO4J_server_bolt_enabled=true
      - NEO4J_server_bolt_listen__address=0.0.0.0:7687
      - NEO4J_server_http_enabled=true
      - NEO4J_server_http_listen__address=0.0.0.0:7474
      - NEO4J_server_https_enabled=false
      - NEO4J_dbms_connector_https_enabled=false
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474/browser/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - knowledgeforge-network

  # KnowledgeForge API
  api:
    build: .
    container_name: knowledgeforge-api
    ports:
      - "8000:8000"
    environment:
      # Database configuration
      - KF_DATABASE__TYPE=postgresql
      - KF_DATABASE__HOST=postgres
      - KF_DATABASE__PORT=5432
      - KF_DATABASE__NAME=knowledgeforge
      - KF_DATABASE__USERNAME=knowledgeforge
      - KF_DATABASE__PASSWORD=knowledgeforge123
      - DATABASE_URL=postgresql://knowledgeforge:knowledgeforge123@postgres:5432/knowledgeforge
      
      # Neo4j configuration - updated to use the neo4j service
      - KF_NEO4J__URI=bolt://neo4j:7687
      - KF_NEO4J__USERNAME=neo4j
      - KF_NEO4J__PASSWORD=password
      
      # API configuration
      - ENVIRONMENT=development
      - DEBUG=true
      - API_HOST=0.0.0.0
      - API_PORT=8000
      
      # Logging
      - LOG_LEVEL=INFO
      - LOG_FILE_ENABLED=true
      - LOG_FILE_PATH=/app/logs/api.log
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./cache:/app/cache
      - ./config.yaml:/app/config.yaml:ro
      # Mount source code for live development
      - ./app:/app/app
      - ./utils:/app/utils
      - ./requirements.txt:/app/requirements.txt
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - knowledgeforge-network

networks:
  knowledgeforge-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  neo4j_plugins:
    driver: local
