version: '3.8'
e
services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: knowledgeforge-postgres
    environment:
      POSTGRES_DB: knowledgeforge
      POSTGRES_USER: knowledgeforge
      POSTGRES_PASSWORD: knowledgeforge123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledgeforge -d knowledgeforge"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - knowledgeforge-network

  # KnowledgeForge API
  api:
    build: .
    container_name: knowledgeforge-api
    ports:
      - "8000:8000"
    environment:
      # Database configuration
      - DATABASE_TYPE=postgresql
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=knowledgeforge
      - DATABASE_USERNAME=knowledgeforge
      - DATABASE_PASSWORD=knowledgeforge123
      - DATABASE_URL=postgresql://knowledgeforge:knowledgeforge123@postgres:5432/knowledgeforge
      
      # Neo4j configuration
      - NEO4J_URI=bolt://host.docker.internal:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
      
      # API configuration
      - ENVIRONMENT=development
      - DEBUG=true
      - API_HOST=0.0.0.0
      - API_PORT=8000
      
      # Logging
      - LOG_LEVEL=INFO
      - LOG_FILE_ENABLED=true
      - LOG_FILE_PATH=/app/logs/api.log
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./cache:/app/cache
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - knowledgeforge-network

networks:
  knowledgeforge-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
