# KnowledgeForge Ontology Extraction API Configuration

# Environment settings
environment: "development"
debug: true

# Database configuration
database:
  type: "postgresql"
  host: "localhost"
  port: 5432
  name: "knowledgeforge"
  username: "knowledgeforge"
  password: "knowledgeforge123"
  connection_pool:
    min_connections: 1
    max_connections: 20
    connection_timeout: 30
    idle_timeout: 300
  ssl_mode: "prefer"
  application_name: "KnowledgeForge-API"

# Neo4j database configuration
neo4j:
  uri: "bolt://localhost:7687"  # Use localhost when running locally, neo4j:7687 when in Docker
  username: "neo4j"
  password: "password"
  database: "neo4j"
  max_connection_pool_size: 50
  connection_timeout: 30
  encrypted: false

# LM Studio LLM service configuration
lmstudio:
  base_url: "http://localhost:1234"
  model_name: "deepseek/deepseek-r1-0528-qwen3-8b"  # Changed from llama2 to available model
  temperature: 0.7
  max_tokens: 100
  timeout: 30
  retry_attempts: 3
  use_embeddings: true
  embedding_model: "text-embedding-nomic-embed-text-v1.5"  # Use available embedding model
  # LM Studio specific settings
  context_length: 4096
  stop_sequences: ["</s>", "<|endoftext|>"]
  top_p: 0.9
  top_k: 40

# Ontology extraction process configuration
extraction:
  confidence_threshold: 0.7
  batch_size: 1000
  max_entities_per_column: 100
  relationship_threshold: 0.6
  enable_semantic_similarity: true
  enable_hierarchical_discovery: true
  enable_temporal_analysis: true
  sample_size: 1000
  parallel_processing: false
  max_workers: 4

# Metadata storage configuration
metadata_storage:
  cache_enabled: true
  cache_size_mb: 100
  auto_cleanup: true
  cleanup_interval_days: 30
  export_format: "json"
  backup_enabled: false
  backup_interval_hours: 24

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_enabled: true
  file_path: "./logs/api.log"
  max_file_size_mb: 10
  backup_count: 5
  console_enabled: true
  json_format: false

# API security settings
security:
  api_key_required: true
  rate_limit_enabled: true
  rate_limit_requests: 100
  rate_limit_window: 60
  cors_origins: ["*"]
  trusted_hosts: ["*"]

# WebSocket configuration
websocket:
  ping_interval: 30
  ping_timeout: 10
  max_connections: 100

# Background task configuration
background_tasks:
  max_concurrent_tasks: 5
  task_timeout: 3600  # 1 hour
  cleanup_interval: 300  # 5 minutes
