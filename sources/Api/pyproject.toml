[tool.poetry]
name = "ontology-extractor"
version = "0.1.0"
description = "Semantic ontology extraction from CSV files with local LLM support using LM Studio, Neo4j for graph storage"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "ontology_extractor", from = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
pandas = "^2.1.0"
neo4j = "^5.15.0"
lmstudio = "^0.1.0"
sentence-transformers = "^2.2.0"
pydantic = "^2.5.0"
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
scikit-learn = "^1.3.0"
pyarrow = "^14.0.0"
networkx = "^3.2.0"
faiss-cpu = "^1.7.4"
umap-learn = "^0.5.5"
matplotlib = "^3.8.0"
seaborn = "^0.13.0"
scipy = "^1.11.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.10.0"
mypy = "^1.7.0"
ruff = "^0.1.0"

[tool.poetry.scripts]
extract-ontology = "ontology_extractor.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.ruff]
target-version = "py39"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
