services:
  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.15-community
    container_name: knowledgeforge-neo4j
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=1G
      - NEO4J_server_bolt_enabled=true
      - NEO4J_server_bolt_advertised__address=localhost:7687
      - NEO4J_server_config_strict__validation_enabled=false
      - NEO4J_server_bolt_listen__address=0.0.0.0:7687
      - NEO4J_server_http_enabled=true
      - NEO4J_server_http_listen__address=0.0.0.0:7474
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    networks:
      - knowledgeforge-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474/browser/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: knowledgeforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: knowledgeforge
      POSTGRES_USER: knowledgeforge
      POSTGRES_PASSWORD: knowledgeforge123
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sources/Api/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - knowledgeforge-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledgeforge -d knowledgeforge"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # KnowledgeForge API Service
  api:
    build:
      context: ./sources/Api
      dockerfile: Dockerfile
    container_name: knowledgeforge-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # PostgreSQL Configuration
      - KF_DATABASE__TYPE=postgresql
      - KF_DATABASE__HOST=postgres
      - KF_DATABASE__PORT=5432
      - KF_DATABASE__NAME=knowledgeforge
      - KF_DATABASE__USERNAME=knowledgeforge
      - KF_DATABASE__PASSWORD=knowledgeforge123
      - DATABASE_URL=postgresql://knowledgeforge:knowledgeforge123@postgres:5432/knowledgeforge
      # Neo4j Configuration
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
      - NEO4J_ENCRYPTED=false
      - KF_NEO4J__URI=bolt://neo4j:7687
      - KF_NEO4J__USERNAME=neo4j
      - KF_NEO4J__PASSWORD=password
      - KF_NEO4J__ENCRYPTED=false
      # LM Studio Configuration (connects to host machine)
      - ONTOLOGY_LMSTUDIO__BASE_URL=http://localhost:1234
      - ONTOLOGY_LMSTUDIO__MODEL_NAME=llama2
      # LLM provider for service extraction
      - KF_LLM_PROVIDER=lmstudio
      - KF_ENABLE_LLM_LABELS=true
      # Service extraction LLM settings (used by LLMManager)
      - LMSTUDIO_BASE_URL=http://host.docker.internal:1234/v1
      - LMSTUDIO_MODEL_NAME=qwen/qwen2.5-vl-7b
      - LMSTUDIO_MODEL=qwen/qwen2.5-vl-7b
      # Config system (KF_ prefix) settings
      - KF_LMSTUDIO__BASE_URL=http://host.docker.internal:1234/v1
      - KF_LMSTUDIO__MODEL_NAME=qwen/qwen2.5-vl-7b
      # Application Configuration
      - ONTOLOGY_CONFIG_FILE=/app/config.yaml
      - ONTOLOGY_ENVIRONMENT=development
      - ONTOLOGY_LOGGING__FILE_PATH=/app/logs/api.log
      - LOG_LEVEL=INFO
    volumes:
      - ./sources/Api:/app
      - ./sources/Api/config.yaml:/app/config.yaml:ro
      - ./sources/data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    networks:
      - knowledgeforge-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # KnowledgeForge UI (Development)
  ui:
    build:
      context: ./sources/UI
      dockerfile: Dockerfile
    container_name: knowledgeforge-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./sources/UI:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=
      - VITE_APP_API_URL=
      - VITE_API_PROXY_TARGET=http://api:8000
    networks:
      - knowledgeforge-network
    stdin_open: true
    tty: true
    depends_on:
      - api

  # Portainer (Docker management UI)
  portainer:
    image: portainer/portainer-ce:latest
    container_name: knowledgeforge-portainer
    restart: unless-stopped
    ports:
      - "9002:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - knowledgeforge-network

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  neo4j_plugins:
    driver: local
  portainer_data:
    driver: local
  postgres_data:
    driver: local

networks:
  knowledgeforge-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
